name: Public documentation availability

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-health:
    name: Availability only, not claim re-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, resolved 2026-09-22
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24, resolved 2026-09-22
        with:
          node-version: '22'
      - run: npm run validate
      - name: Check allowlisted documentation, excluding LineStar
        run: npm run sources:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24, resolved 2026-09-22
        if: always()
        with:
          name: source-health
          path: artifacts/source-health.json
          retention-days: 30
